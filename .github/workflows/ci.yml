name: InternHub CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "InternHub CI started"
          test -f frontend/Dockerfile || test -f Dockerfile
          test -f backend/package.json
          echo "Project files verified"

      - name: Check backend package
        working-directory: backend
        run: npm ci

      - name: CI completed
        run: echo "InternHub CI completed successfully"