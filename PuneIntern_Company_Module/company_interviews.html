<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PuneIntern | Interviews</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="company.css"></head>
<body>
<aside class="sidebar" id="sidebar"><div class="brand">Pune<span>Intern</span></div>
<div class="company-mini"><div class="company-avatar">TN</div><div><h6>TechNova Solutions</h6><small>Company Account</small></div></div>
<nav class="sidebar-menu"><a href="company_dashboard.html" class=""><i class="bi bi-grid-1x2-fill"></i>Dashboard</a><a href="company_post_internship.html" class=""><i class="bi bi-plus-square"></i>Post Internship</a><a href="company_internships.html" class=""><i class="bi bi-briefcase"></i>My Internships</a><a href="company_applications.html" class=""><i class="bi bi-file-earmark-person"></i>Applications</a><a href="company_shortlisted.html" class=""><i class="bi bi-star"></i>Shortlisted</a><a href="company_interviews.html" class="active"><i class="bi bi-calendar2-check"></i>Interviews</a><a href="company_hired.html" class=""><i class="bi bi-person-check"></i>Hired Interns</a><a href="company_profile.html" class=""><i class="bi bi-building"></i>Company Profile</a><a href="company_settings.html" class=""><i class="bi bi-gear"></i>Settings</a></nav><div class="logout-link"><a href="company_login.html"><i class="bi bi-box-arrow-left"></i> Logout</a></div></aside>
<main class="main"><header class="topbar"><button class="mobile-menu" id="mobileMenu"><i class="bi bi-list"></i></button><div></div>
<div class="d-flex align-items-center gap-3"><button class="notification"><i class="bi bi-bell"></i><span class="dot"></span></button><div class="d-none d-md-block"><strong>TechNova Solutions</strong><small class="text-muted d-block">Company Portal</small></div></div></header>
<section class="content"><div class="row align-items-center mb-4"><div class="col"><div class="page-title"><h2>Interviews</h2><p>Schedule and manage candidate interviews.</p></div></div><div class="col-auto"><button class="action-btn" data-bs-toggle="modal" data-bs-target="#ivModal"><i class="bi bi-calendar-plus"></i> Schedule Interview</button></div></div>
<div class="row g-4" id="ivCards"></div>
<div class="modal fade" id="ivModal"><div class="modal-dialog"><div class="modal-content"><form id="ivForm"><div class="modal-header"><h5>Schedule Interview</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input class="form-control mb-3" required placeholder="Candidate name"><input class="form-control mb-3" required placeholder="Internship"><input class="form-control mb-3" type="date" required><input class="form-control mb-3" type="time" required><select class="form-select"><option>Online</option><option>Office</option></select></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="action-btn">Schedule</button></div></form></div></div></div></section></main>
<script>document.getElementById("mobileMenu").onclick=()=>document.getElementById("sidebar").classList.toggle("show");let iv=[["Rahul Sharma","Frontend Developer Intern","27 Aug 2026","11:00 AM","Online","R"],["Priya Patil","Python Developer Intern","29 Aug 2026","2:00 PM","Online","P"],["Sneha Joshi","UI/UX Design Intern","30 Aug 2026","12:30 PM","Office","S"],["Akash Pawar","Python Developer Intern","02 Sep 2026","3:00 PM","Online","A"]];
ivCards.innerHTML=iv.map(x=>`<div class="col-md-6 col-xl-4"><div class="card h-100"><div class="card-body-custom"><div class="d-flex justify-content-between"><span class="avatar">${x[5]}</span><span class="status status-orange">${x[4]}</span></div><h5 class="mt-3" style="color:var(--navy)">${x[0]}</h5><p class="small text-muted">${x[1]}</p><hr><div class="small"><i class="bi bi-calendar3"></i> ${x[2]}</div><div class="small mt-2"><i class="bi bi-clock"></i> ${x[3]}</div><div class="d-flex gap-2 mt-3"><button class="btn btn-sm btn-outline-warning flex-fill">Reschedule</button><button class="btn btn-sm btn-outline-success flex-fill">Complete</button></div></div></div></div>`).join("");
ivForm.onsubmit=e=>{e.preventDefault();alert("Interview scheduled in demo mode. Connect to Flask/MySQL for persistence.");bootstrap.Modal.getInstance(ivModal).hide()};</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
