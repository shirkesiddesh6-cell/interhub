<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PuneIntern | Shortlisted</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="company.css"></head>
<body>
<aside class="sidebar" id="sidebar"><div class="brand">Pune<span>Intern</span></div>
<div class="company-mini"><div class="company-avatar">TN</div><div><h6>TechNova Solutions</h6><small>Company Account</small></div></div>
<nav class="sidebar-menu"><a href="company_dashboard.html" class=""><i class="bi bi-grid-1x2-fill"></i>Dashboard</a><a href="company_post_internship.html" class=""><i class="bi bi-plus-square"></i>Post Internship</a><a href="company_internships.html" class=""><i class="bi bi-briefcase"></i>My Internships</a><a href="company_applications.html" class=""><i class="bi bi-file-earmark-person"></i>Applications</a><a href="company_shortlisted.html" class="active"><i class="bi bi-star"></i>Shortlisted</a><a href="company_interviews.html" class=""><i class="bi bi-calendar2-check"></i>Interviews</a><a href="company_hired.html" class=""><i class="bi bi-person-check"></i>Hired Interns</a><a href="company_profile.html" class=""><i class="bi bi-building"></i>Company Profile</a><a href="company_settings.html" class=""><i class="bi bi-gear"></i>Settings</a></nav><div class="logout-link"><a href="company_login.html"><i class="bi bi-box-arrow-left"></i> Logout</a></div></aside>
<main class="main"><header class="topbar"><button class="mobile-menu" id="mobileMenu"><i class="bi bi-list"></i></button><div></div>
<div class="d-flex align-items-center gap-3"><button class="notification"><i class="bi bi-bell"></i><span class="dot"></span></button><div class="d-none d-md-block"><strong>TechNova Solutions</strong><small class="text-muted d-block">Company Portal</small></div></div></header>
<section class="content"><div class="page-title mb-4"><h2>Shortlisted Candidates</h2><p>Manage candidates who have moved forward in your hiring process.</p></div><div class="row g-4" id="cards"></div></section></main>
<script>document.getElementById("mobileMenu").onclick=()=>document.getElementById("sidebar").classList.toggle("show");let c=[["Priya Patil","Python Developer Intern","Python • Flask • MySQL • REST API","B.Sc Computer Science","92%","P"],["Sneha Joshi","UI/UX Design Intern","Figma • UI Design • Prototyping","B.Sc IT","88%","S"],["Rahul Sharma","Frontend Developer Intern","HTML • CSS • JavaScript • Bootstrap","B.Sc Computer Science","86%","R"],["Akash Pawar","Python Developer Intern","Python • Django • SQL","BCA","84%","A"]];
cards.innerHTML=c.map(x=>`<div class="col-md-6"><div class="candidate-card h-100"><div class="d-flex align-items-center"><span class="avatar me-3">${x[5]}</span><div class="flex-grow-1"><h5 class="mb-1" style="color:var(--navy)">${x[0]}</h5><small class="text-muted">${x[1]}</small></div><span class="status status-green">${x[4]} Match</span></div><p class="small mt-3 mb-2"><strong>Course:</strong> ${x[3]}</p><div>${x[2].split(" • ").map(s=>`<span class="skill">${s}</span>`).join("")}</div><div class="d-flex gap-2 mt-3"><a href="company_interviews.html" class="btn btn-warning btn-sm flex-fill">Schedule Interview</a><button class="btn btn-outline-secondary btn-sm">View Profile</button></div></div></div>`).join("");</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
