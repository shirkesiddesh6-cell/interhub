<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="contact.css">
</head>
<body>

<div class="container py-5">
    <!-- Header Section -->
    <div class="text-center mb-5">
        <span class="section-subtitle text-uppercase">Contact Us</span>
        <h1 class="fw-bold mt-2 text-dark">We Are Here to Help!</h1>
        <div class="divider"></div>
        <p class="text-secondary mx-auto header-text">
            Have a question or want to work with us? Send us a message and we'll get back to you as soon as possible.
        </p>
    </div>

    <!-- Info Cards Section -->
    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="custom-card info-card text-center h-100">
                <div class="info-icon">
                    <i class="bi bi-geo-alt-fill"></i>
                </div>
                <div class="info-title">Address</div>
                <p class="info-text">
                    123 Pune Street,<br>
                    Shivajinagar, Pune,<br>
                    Maharashtra 411005
                </p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="custom-card info-card text-center h-100">
                <div class="info-icon">
                    <i class="bi bi-envelope-fill"></i>
                </div>
                <div class="info-title">Email</div>
                <p class="info-text">
                    hello@puneinternship.com
                </p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="custom-card info-card text-center h-100">
                <div class="info-icon">
                    <i class="bi bi-telephone-fill"></i>
                </div>
                <div class="info-title">Phone</div>
                <p class="info-text">
                    +91 98765 43210
                </p>
            </div>
        </div>
    </div>

    <!-- Form & Map Section -->
    <div class="row g-4">
        <!-- Contact Form -->
        <div class="col-lg-6">
            <div class="custom-card p-4">
                <h5 class="fw-bold text-dark mb-4">Send us a Message</h5>
                <form>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <input type="text" class="form-control" placeholder="Your Name" required>
                        </div>
                        <div class="col-md-6">
                            <input type="email" class="form-control" placeholder="Your Email" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Subject" required>
                    </div>
                    <div class="mb-4">
                        <textarea class="form-control" rows="4" placeholder="Your Message" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-custom w-100">
                        Send Message <i class="bi bi-send-fill ms-1"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- Embedded Map -->
        <div class="col-lg-6">
            <div class="map-container">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d121059.04711155914!2d73.79292694186594!3d18.524545043542265!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2bf2e67461101%3A0x828d43bf9d9ee343!2sPune%2C%20Maharashtra!5e0!3m2!1sen!2sin!4v1700000000000!5m2!1sen!2sin" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
