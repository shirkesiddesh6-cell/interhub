<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PuneIntern | Internships</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="college.css">
</head>
<body>
<aside class="sidebar" id="sidebar">
<div class="brand">Pune<span>Intern</span></div>
<div class="college-mini"><div class="college-avatar">G</div><div><h6>Garware College</h6><small>College Account</small></div></div>
<nav class="sidebar-menu"><a href="college_dashboard.html" class=""><i class="bi bi-grid-1x2-fill"></i>Dashboard</a><a href="college_students.html" class=""><i class="bi bi-people"></i>Students</a><a href="college_internships.html" class="active"><i class="bi bi-briefcase"></i>Internships</a><a href="college_applications.html" class=""><i class="bi bi-file-earmark-person"></i>Applications</a><a href="college_companies.html" class=""><i class="bi bi-building"></i>Companies</a><a href="college_placements.html" class=""><i class="bi bi-graph-up-arrow"></i>Placement Overview</a><a href="college_profile.html" class=""><i class="bi bi-person-badge"></i>College Profile</a><a href="college_settings.html" class=""><i class="bi bi-gear"></i>Settings</a></nav>
<div class="logout-link"><a href="college_login.html"><i class="bi bi-box-arrow-left"></i> Logout</a></div>
</aside>
<main class="main">
<header class="topbar">
<button class="mobile-menu" id="mobileMenu"><i class="bi bi-list"></i></button><div></div>
<div class="d-flex align-items-center gap-3"><button class="notification"><i class="bi bi-bell"></i><span class="dot"></span></button>
<div class="d-none d-md-block"><strong>MES Abasaheb Garware College</strong><small class="text-muted d-block">College Portal</small></div></div>
</header>
<section class="content"><div class="page-title mb-4"><h2>Internship Opportunities</h2><p>Discover internships available to your students.</p></div>
<div class="filter-box mb-4"><div class="row g-2"><div class="col-lg-4"><input id="q" class="form-control" placeholder="Search internship or company"></div><div class="col-md-4 col-lg-2"><select id="cat" class="form-select"><option value="">All Categories</option><option>Technology</option><option>Design</option><option>Data</option></select></div><div class="col-md-4 col-lg-2"><select id="loc" class="form-select"><option value="">All Locations</option><option>Pune</option><option>Mumbai</option><option>Remote</option></select></div><div class="col-md-4 col-lg-2"><select id="paid" class="form-select"><option value="">Any Stipend</option><option>Paid</option><option>Unpaid</option></select></div><div class="col-lg-2"><button id="clear" class="btn btn-outline-secondary w-100">Clear</button></div></div></div><div class="row g-4" id="cards"></div></section>
</main>
<script>
document.getElementById("mobileMenu").onclick=()=>document.getElementById("sidebar").classList.toggle("show");
document.addEventListener("click",e=>{const s=document.getElementById("sidebar"),m=document.getElementById("mobileMenu");if(innerWidth<=991&&!s.contains(e.target)&&!m.contains(e.target))s.classList.remove("show")});
let jobs=[["Frontend Developer Intern","TechNova Solutions","Technology","Pune","₹12,000 / month",32,"Paid","bi-code-slash"],["Python Developer Intern","DataCore Technologies","Technology","Remote","₹15,000 / month",18,"Paid","bi-terminal"],["UI/UX Design Intern","Creative Studio","Design","Pune","₹8,000 / month",14,"Paid","bi-palette"],["Data Analyst Intern","DataCore Technologies","Data","Mumbai","₹10,000 / month",21,"Paid","bi-bar-chart"],["Web Development Intern","CodeBridge Technologies","Technology","Pune","Unpaid",9,"Unpaid","bi-globe"]];
function render(){let a=jobs.filter(x=>(!q.value||x.join(" ").toLowerCase().includes(q.value.toLowerCase()))&&(!cat.value||x[2]==cat.value)&&(!loc.value||x[3]==loc.value)&&(!paid.value||x[6]==paid.value));cards.innerHTML=a.map(x=>`<div class="col-md-6 col-xl-4"><div class="card h-100"><div class="card-body-custom"><div class="d-flex justify-content-between"><div class="item-icon"><i class="bi ${x[7]}"></i></div><span class="status ${x[6]=="Paid"?"status-green":"status-orange"}">${x[6]}</span></div><h5 class="mt-3" style="color:var(--navy)">${x[0]}</h5><p class="small text-muted"><i class="bi bi-building"></i> ${x[1]}</p><div class="small mb-2"><i class="bi bi-geo-alt"></i> ${x[3]} • <i class="bi bi-cash"></i> ${x[4]}</div><p class="small text-muted">${x[5]} student applications</p><button class="btn btn-success btn-sm w-100">View Details</button></div></div></div>`).join("")||'<div class="col-12"><div class="empty">No internships match your filters.</div></div>'}
["q","cat","loc","paid"].forEach(id=>document.getElementById(id).addEventListener("input",render));clear.onclick=()=>{["q","cat","loc","paid"].forEach(id=>document.getElementById(id).value="");render()};render();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
