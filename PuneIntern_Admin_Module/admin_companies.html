<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PuneIntern Admin | Companies</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><aside class="sidebar" id="side"><div class="brand">Pune<span>Intern</span></div><div class="admin-mini"><div class="avatar">AD</div><div><h6>Admin</h6><small>Administrator</small></div></div><nav class="menu"><a href="admin_dashboard.html" class=""><i class="bi bi-grid-1x2-fill"></i>Dashboard</a><a href="admin_students.html" class=""><i class="bi bi-people"></i>Students</a><a href="admin_companies.html" class="active"><i class="bi bi-building"></i>Companies</a><a href="admin_colleges.html" class=""><i class="bi bi-mortarboard"></i>Colleges</a><a href="admin_internships.html" class=""><i class="bi bi-briefcase"></i>Internships</a><a href="admin_applications.html" class=""><i class="bi bi-file-earmark-text"></i>Applications</a><a href="admin_reports.html" class=""><i class="bi bi-bar-chart"></i>Reports</a><a href="admin_announcements.html" class=""><i class="bi bi-megaphone"></i>Announcements</a><a href="admin_profile.html" class=""><i class="bi bi-person-badge"></i>Admin Profile</a><a href="admin_settings.html" class=""><i class="bi bi-gear"></i>Settings</a></nav><div class="logout"><a href="admin_login.html" class="menu-link"><i class="bi bi-box-arrow-left"></i> Logout</a></div></aside><main class="main"><header class="topbar"><button class="mobile" id="mob"><i class="bi bi-list"></i></button><div></div><div class="d-flex align-items-center gap-3"><button class="btn border rounded-circle" style="width:42px;height:42px"><i class="bi bi-bell"></i></button><div class="d-none d-md-block"><strong>Administrator</strong><small class="text-muted d-block">PuneIntern Control Panel</small></div></div></header><section class="content"><div class="title mb-4"><h2>Companies</h2><p>Verify and manage companies using PuneIntern.</p></div><div class="filter mb-4 p-3"><div class="row g-2"><div class="col-md-8"><input id="q" class="form-control" placeholder="Search..."></div><div class="col-md-4"><select id="filter" class="form-select"><option value="">All Status</option><option>Active</option><option>Pending</option><option>Verified</option><option>Blocked</option><option>Rejected</option></select></div></div></div><div class="card"><div class="head"><h5>Companies List</h5><span id="count" class="small text-muted"></span></div><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Company</th><th>Industry</th><th>Location</th><th>Size</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script>mob.onclick=()=>side.classList.toggle("show");let data=[["TechNova Solutions","Technology","Pune","186 employees","Verified"],["CloudByte Systems","Software","Remote","72 employees","Verified"],["Startup Hub Pvt Ltd","Technology","Pune","25 employees","Pending"],["Unknown Tech","IT Services","Mumbai","12 employees","Blocked"]];function render(){let x=data.filter(v=>(!q.value||v.join(" ").toLowerCase().includes(q.value.toLowerCase()))&&(!filter.value||v[4]==filter.value));count.textContent=x.length+" records";rows.innerHTML=x.map(v=>`<tr><td>${v[0]}</td><td>${v[1]}</td><td>${v[2]}</td><td>${v[3]}</td><td><span class="badge-status ${v[4]=="Pending"?"pending":v[4]=="Blocked"||v[4]=="Rejected"?"blocked":"ok"}">${v[4]}</span></td><td><button class="btn btn-sm btn-outline-secondary">View</button></td></tr>`).join("")}q.oninput=render;filter.onchange=render;render();</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
