<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PuneIntern Admin | Reports</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><aside class="sidebar" id="side"><div class="brand">Pune<span>Intern</span></div><div class="admin-mini"><div class="avatar">AD</div><div><h6>Admin</h6><small>Administrator</small></div></div><nav class="menu"><a href="admin_dashboard.html" class=""><i class="bi bi-grid-1x2-fill"></i>Dashboard</a><a href="admin_students.html" class=""><i class="bi bi-people"></i>Students</a><a href="admin_companies.html" class=""><i class="bi bi-building"></i>Companies</a><a href="admin_colleges.html" class=""><i class="bi bi-mortarboard"></i>Colleges</a><a href="admin_internships.html" class=""><i class="bi bi-briefcase"></i>Internships</a><a href="admin_applications.html" class=""><i class="bi bi-file-earmark-text"></i>Applications</a><a href="admin_reports.html" class="active"><i class="bi bi-bar-chart"></i>Reports</a><a href="admin_announcements.html" class=""><i class="bi bi-megaphone"></i>Announcements</a><a href="admin_profile.html" class=""><i class="bi bi-person-badge"></i>Admin Profile</a><a href="admin_settings.html" class=""><i class="bi bi-gear"></i>Settings</a></nav><div class="logout"><a href="admin_login.html" class="menu-link"><i class="bi bi-box-arrow-left"></i> Logout</a></div></aside><main class="main"><header class="topbar"><button class="mobile" id="mob"><i class="bi bi-list"></i></button><div></div><div class="d-flex align-items-center gap-3"><button class="btn border rounded-circle" style="width:42px;height:42px"><i class="bi bi-bell"></i></button><div class="d-none d-md-block"><strong>Administrator</strong><small class="text-muted d-block">PuneIntern Control Panel</small></div></div></header><section class="content"><div class="title mb-4"><h2>Reports & Analytics</h2><p>Platform-level performance and recruitment statistics.</p></div><div class="row g-3 mb-4" id="stats"></div><div class="row g-4"><div class="col-lg-7"><div class="card"><div class="head"><h5>Monthly Applications</h5></div><div class="body" id="chart"></div></div></div><div class="col-lg-5"><div class="card"><div class="head"><h5>Internship Categories</h5></div><div class="body" id="cats"></div></div></div></div></section></main><script>mob.onclick=()=>side.classList.toggle("show");let s=[["1,248","Applications","orange"],["318","Active Internships","green"],["186","Companies","navy"],["72%","Placement Rate","wine"]];stats.innerHTML=s.map(x=>`<div class="col-sm-6 col-xl-3"><div class="stat"><div class="icon ${x[2]}"><i class="bi bi-bar-chart"></i></div><h3>${x[0]}</h3><p>${x[1]}</p></div></div>`).join("");chart.innerHTML=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug"].map((m,i)=>`<div class="mb-3"><div class="d-flex justify-content-between small"><span>${m}</span><strong>${120+i*18}</strong></div><div class="progress" style="height:9px"><div class="progress-bar bg-orange" style="width:${35+i*8}%"></div></div></div>`).join("");cats.innerHTML=[["Web Development","38%"],["Data / AI","24%"],["Software Testing","16%"],["UI/UX","12%"],["Other","10%"]].map(x=>`<div class="d-flex justify-content-between py-3 border-bottom"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("");</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
