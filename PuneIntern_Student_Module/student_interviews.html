<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PuneIntern | Interviews</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="student.css"></head>
<body><aside class="sidebar" id="sidebar"><div class="brand">Pune<span>Intern</span></div><div class="student-mini"><div class="student-avatar">SG</div><div><h6>Suraj Gade</h6><small>Student Account</small></div></div><nav class="sidebar-menu"><a href="student_dashboard.html" class=""><i class="bi bi-grid-1x2-fill"></i>Dashboard</a><a href="student_find_internships.html" class=""><i class="bi bi-search"></i>Find Internships</a><a href="student_my_applications.html" class=""><i class="bi bi-file-earmark-person"></i>My Applications</a><a href="student_shortlisted.html" class=""><i class="bi bi-star"></i>Shortlisted</a><a href="student_interviews.html" class="active"><i class="bi bi-calendar2-check"></i>Interviews</a><a href="student_saved_internships.html" class=""><i class="bi bi-bookmark"></i>Saved Internships</a><a href="student_my_internships.html" class=""><i class="bi bi-briefcase"></i>My Internships</a><a href="student_profile.html" class=""><i class="bi bi-person"></i>My Profile</a><a href="student_resume.html" class=""><i class="bi bi-file-earmark-pdf"></i>My Resume</a><a href="student_settings.html" class=""><i class="bi bi-gear"></i>Settings</a></nav><div class="logout-link"><a href="student_login.html"><i class="bi bi-box-arrow-left"></i> Logout</a></div></aside>
<main class="main"><header class="topbar"><button class="mobile-menu" id="mobileMenu"><i class="bi bi-list"></i></button><div></div><div class="d-flex align-items-center gap-3"><button class="btn border rounded-circle position-relative" style="width:42px;height:42px"><i class="bi bi-bell"></i><span style="width:8px;height:8px;border-radius:50%;background:var(--orange);position:absolute;right:7px;top:7px"></span></button><div class="d-none d-md-block"><strong>Suraj Gade</strong><small class="text-muted d-block">Student Portal</small></div></div></header><section class="content"><div class="page-title mb-4"><h2>My Interviews</h2><p>Stay prepared for upcoming internship interviews.</p></div><div class="row g-4" id="cards"></div></section></main>
<script>document.getElementById("mobileMenu").onclick=()=>document.getElementById("sidebar").classList.toggle("show");let a=[["TechNova Solutions","Frontend Developer Intern","27 Aug 2026","11:00 AM","Online","Meeting link available","TN"],["DesignHub","UI/UX Design Intern","30 Aug 2026","12:30 PM","Online","Meeting link available","DH"],["CloudByte Systems","Python Developer Intern","02 Sep 2026","3:00 PM","Online","Waiting for confirmation","CB"]];cards.innerHTML=a.map(x=>`<div class="col-md-6 col-xl-4"><div class="internship-card"><div class="d-flex justify-content-between"><div class="company-logo">${x[6]}</div><span class="status ${x[5].includes("available")?"status-green":"status-orange"}">${x[5]}</span></div><h5 class="mt-3" style="color:var(--navy)">${x[0]}</h5><p class="small">${x[1]}</p><hr><div class="small mb-2"><i class="bi bi-calendar3"></i> ${x[2]}</div><div class="small mb-2"><i class="bi bi-clock"></i> ${x[3]}</div><div class="small"><i class="bi bi-camera-video"></i> ${x[4]}</div><button class="btn btn-warning btn-sm w-100 mt-3">View Interview</button></div></div>`).join("");</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
